name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - run: pip install pillow

      - run: npm ci

      - run: chmod +x android/gradlew

      - name: Build debug APK (sideloadable)
        run: npm run android:build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - uses: actions/upload-artifact@v7
        with:
          name: rail-refuge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish APK to GitHub Releases
    needs: apk
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: rail-refuge-debug-apk
          path: apk

      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: android-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          mv apk/app-debug.apk apk/rail-refuge.apk
          cat > release-notes.md <<EOF
          Automatically built from commit ${GITHUB_SHA} on main.

          Download rail-refuge.apk below, open it on your Android device, and allow "Install unknown apps" when prompted.

          This is a debug-signed APK for sideloading (Android 7.0 or newer).
          EOF
          gh release create "$RELEASE_TAG" apk/rail-refuge.apk \
            --target "$GITHUB_SHA" \
            --title "Android build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes-file release-notes.md \
            --latest
